<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://extras.conciergeriepriveedeauville.fr/favicon.ico" sizes="any">
<title>Lien liste de courses – outil concierge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f6f7f9;color:#222831;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:620px;margin:0 auto;padding:28px 16px 60px}
.stripes{height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,#222831 0 28px,#e9533b 28px 56px,#4a76ad 56px 84px,#c9d2de 84px 112px)}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:400;font-size:2rem;margin:18px 0 4px}
p.s{color:#5d6672;margin:0 0 18px}
.card{background:#fff;border:1px solid #dde1e6;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:#5d6672;margin-bottom:12px}
input,select,textarea{font:inherit;color:#222831;background:#fff;border:1px solid #dde1e6;border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button,a.b{border:0;border-radius:999px;padding:12px 18px;font:600 15px/1 system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.dark{background:#222831;color:#fff}.wa{background:#25d366;color:#fff}.ghost{background:#fff;color:#222831;border:1px solid #dde1e6}
.ok{color:#2f7d4f;font-size:.85rem;min-height:1.2em}
@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="stripes"></div>
<h1>Lien liste de courses</h1>
<p class="s">Outil interne : remplissez les infos du séjour, puis copiez le message ou ouvrez WhatsApp. Le client arrive sur sa liste déjà remplie.</p>
<div class="card">
<label>Prénom et nom du client<input id="n" autocomplete="off"></label>
<label>Logement<input id="l" autocomplete="off"></label>
<div class="row"><label>Date d'arrivée<input id="a" type="date"></label><label>Nombre de personnes<input id="p" placeholder="ex. 6 (dont 2 enfants)"></label></div>
<div class="row"><label>Langue du client<select id="g"><option value="fr">Français</option><option value="en">Anglais</option></select></label><label>WhatsApp du client (facultatif)<input id="w" inputmode="tel" placeholder="+33 6 12 34 56 78"></label></div>
</div>
<div class="card">
<label>Lien<input id="url" readonly></label>
<label>Message<textarea id="msg"></textarea></label>
<div class="btns"><button type="button" class="dark" id="cp">Copier le message</button><a class="b wa" id="op" target="_blank" rel="noopener">Ouvrir WhatsApp</a><button type="button" class="ghost" id="cl">Copier le lien</button></div>
<p class="ok" id="ok"></p>
</div>
</main>
<script>
(function(){
var B="https://extras.conciergeriepriveedeauville.fr/courses/liste/",$=function(i){return document.getElementById(i)};
function first(n){return (n||"").trim().split(/\s+/)[0]||""}
function build(){var q=new URLSearchParams();["n","l","a","p"].forEach(function(k){var v=$(k).value.trim();if(v)q.set(k,v)});
 var en=$("g").value==="en";if(en)q.set("lang","en");var u=B+(q.toString()?"?"+q.toString():"");$("url").value=u;
 var f=first($("n").value),lg=$("l").value.trim();
 var m=en?("Hello"+(f?" "+f:"")+",\n\nTo prepare your stay"+(lg?" at "+lg:"")+", here is your grocery list: choose the quantities aisle by aisle, then send it back to us on WhatsApp in one tap. We will order everything and put it away before you arrive.\n\n"+u+"\n\nSee you soon,\nLola – Conciergerie Privée Deauville")
  :("Bonjour"+(f?" "+f:"")+",\n\nPour préparer votre séjour"+(lg?" à "+lg:"")+", voici votre liste de courses : choisissez les quantités rayon par rayon, puis renvoyez-la-nous sur WhatsApp en un clic. Nous commandons et rangeons tout avant votre arrivée.\n\n"+u+"\n\nÀ très bientôt,\nLola – Conciergerie Privée Deauville");
 $("msg").value=m;var w=$("w").value.replace(/[^0-9+]/g,"");if(w.indexOf("+")===0)w=w.slice(1);else if(w.indexOf("0")===0)w="33"+w.slice(1);
 $("op").href="https://wa.me/"+(w||"")+"?text="+encodeURIComponent(m)}
["n","l","a","p","g","w"].forEach(function(k){$(k).addEventListener("input",build);$(k).addEventListener("change",build)});
function copy(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$("ok").textContent=msg},function(){var x=$("msg");x.select();document.execCommand("copy");$("ok").textContent=msg})}
$("cp").onclick=function(){copy($("msg").value,"Message copié.")};$("cl").onclick=function(){copy($("url").value,"Lien copié.")};
build();
})();
</script>
</body></html>
